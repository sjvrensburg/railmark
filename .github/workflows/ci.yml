name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # The committed fixture must stay in step with its generator, or the
      # integration checks below would be asserting against a stale document.
      - name: Check test fixture is reproducible
        run: |
          python3 tests/fixtures/make-sample-pdf.py /tmp/regen.pdf
          cmp tests/fixtures/sample.pdf /tmp/regen.pdf

      # Unit tests fake IPdfService/IPdfTextService, so nothing there exercises
      # real pdfium geometry. This does.
      - name: Integration checks against the fixture PDF
        run: ./tests/integration-smoke.sh dotnet run --project RailMark/ -c Release --

      # --from-docx renders through LibreOffice. Writer alone is enough; Liberation
      # gives the converter metric-compatible stand-ins for Times/Arial/Courier.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
          soffice --version

      # End to end: Word review document → LibreOffice → PDF annotations, read back
      # and checked. REQUIRE makes a missing soffice a failure here, not a SKIP.
      - name: Integration checks for --from-docx
        env:
          RAILMARK_REQUIRE_SOFFICE: '1'
        run: ./tests/docx-smoke.sh dotnet run --project RailMark/ -c Release --

  # Windows packaging is the least-exercised path, so prove it still compiles on
  # every change rather than discovering it is broken while cutting a release.
  publish-matrix:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        run: |
          dotnet publish RailMark/ -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:DebugType=none -o out

      - name: Check native dependencies were published
        run: |
          set -eu
          case "${{ matrix.rid }}" in
            linux-x64) expected="libpdfium.so libSkiaSharp.so libonnxruntime.so" ;;
            win-x64)   expected="pdfium.dll libSkiaSharp.dll onnxruntime.dll" ;;
          esac
          for lib in $expected; do
            if [ ! -f "out/$lib" ]; then
              echo "Missing native library in publish output: $lib" >&2
              exit 1
            fi
            echo "  found $lib"
          done
